<text x="56.0" y="325.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">2 → 3 → 4: at 4, neighbor 2 is visited and is NOT 4's parent (3) → cycle. The parent</text>
<text x="56.0" y="344.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">exemption is one argument in the recursion — no extra state.</text>
