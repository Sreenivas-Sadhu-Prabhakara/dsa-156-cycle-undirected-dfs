<text x="56.0" y="571.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">DFS and BFS find the same answer; DFS is shorter to write, BFS avoids deep recursion</text>
<text x="56.0" y="590.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">on long chains. Both O(V+E). Parallel-edge graphs need edge-ids instead of the</text>
<text x="56.0" y="609.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">parent rule.</text>
<text x="72.0" y="644.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">verdict</text>
<rect x="84.0" y="625.0" width="180.0" height="28.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
